services:
  # -------------------------------------------------------------
  # 1. MediVault Python FastAPI Backend Service (Free Tier)
  # -------------------------------------------------------------
  - type: web
    name: medivault-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      # Connects to your external free Neon / Supabase PostgreSQL database
      - key: DATABASE_URL
        sync: false
