services:
  # -------------------------------------------------------------
  # 1. MediVault Python FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: medivault-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medivault-db
          property: connectionString

  # -------------------------------------------------------------
  # 2. MediVault Vite React Frontend (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: medivault-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medivault-api
          property: host

databases:
  # -------------------------------------------------------------
  # 3. Managed PostgreSQL Database (Free Tier)
  # -------------------------------------------------------------
  - name: medivault-db
    databaseName: medivault
    user: medivault_user
    plan: free
